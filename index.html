    <title>The Show That Didn’t Happen — AFAX Story</title>
    <script>
      (function () {
        var theme = "light";
        try {
          var stored = localStorage.getItem("afax-theme");
          if (stored === "light" || stored === "dark") {
            theme = stored;
          } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
            theme = "dark";
          }
          localStorage.setItem("afax-theme", theme);
        } catch (e) {
          /* storage unavailable — fall back to light */
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.backgroundColor =
          theme === "dark" ? "#221413" : "#5e2b20";
      })();
    </script>
